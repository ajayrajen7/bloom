# Sprite taxonomy: category > type > [attributes]
#
# Each leaf is a sprite filename (without path prefix).
# Sprites under the same type are VARIANTS of the same object.
# Activities must pick items from different types to offer real discrimination.
#
# Level definitions:
#   category  — broadest grouping (fruits, animals, clothing …)
#   type      — the specific object a child would name (apple, dog, shoe …)
#   attribute — a variant of that object (colour, size, style)
#               If a type has only one sprite, the attribute equals the type.

fruits:
  apple:
